# Name of your application. Used to uniquely configure containers.
service: hmt-core

# Name of the container image.
image: hmt/hmt-core

# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_SERVER_IP") %>

# Enable SSL auto certification via Let's Encrypt (and allow for multiple apps on one server).
# Set ssl: false if using something like Cloudflare to terminate SSL (but keep host!).
proxy:
  ssl: true
  hosts:
    - hmt-api.parkroadfellowship.org # For the API
    - hmt.parkroadfellowship.org # For the APP
    # - hmt-ws.parkroadfellowship.org (WebSocket not needed — Reverb disabled)
  # kamal-proxy connects to your container over port 80, use `app_port` to specify a different port.
  app_port: 8050
  response_timeout: 120
  healthcheck:
    path: /robots.txt
    interval: 3
    timeout: 60

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  server: prfcore.azurecr.io
  username: prfcore

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  args:
    IMAGE_NAME: HMT Core
  cache:
    type: registry
    options: mode=max

deploy_timeout: 180
drain_timeout: 30
# Inject ENV variables into containers (secrets come from .kamal/secrets).
#
env:
  clear:
    APP_NAME: HMT
    APP_ENV: production
    APP_DEBUG: false
    APP_TIMEZONE: UTC
    APP_URL: https://hmt.parkroadfellowship.org
    APP_LOCALE: en
    APP_FALLBACK_LOCALE: en
    APP_FAKER_LOCALE: en_US
    APP_MAINTENANCE_DRIVER: cache
    APP_MAINTENANCE_STORE: redis
    BCRYPT_ROUNDS: 12
    LOG_CHANNEL: json_daily
    LOG_LEVEL: debug
    LOG_STACK: json_daily
    LOG_DEPRECATIONS_CHANNEL: "null"
    SESSION_DRIVER: redis
    SESSION_LIFETIME: 120
    SESSION_ENCRYPT: false
    SESSION_PATH: /
    SESSION_DOMAIN: "null"
    MAIL_MAILER: smtp
    MAIL_FROM_NAME: HMT Missions
    VITE_APP_NAME: HMT
    BROADCAST_CONNECTION: log
    FILESYSTEM_DISK: azure
    QUEUE_CONNECTION: database
    TELESCOPE_QUEUE_CONNECTION: database
    CACHE_STORE: redis
    CACHE_PREFIX: "hmt:"
    MEMCACHED_HOST: 127.0.0.1
    REDIS_CLIENT: phpredis
    DB_CONNECTION: pgsql
    DB_PORT: 5432
    DB_DATABASE: hmt
    WEATHER_API_UNITS: metric
    FILAMENT_FILESYSTEM_DISK: azure
    FILAMENT_GOOGLE_MAPS_FORCE_HTTPS: true
    PAYSTACK_API_URL: https://api.paystack.co
    PULSE_ENABLED: false
    FIREBASE_CREDENTIALS: storage/app/firebase-auth.json
    GOOGLE_SERVICE_ACCOUNT_KEY_PATH: storage/app/firebase-auth.json
    GOTENBERG_URL: http://prf-core-gotenberg:3000
    MEDIA_PATH_PREFIX: hmt-core
    SMS_ENABLED: false
    PAYSTACK_ENABLED: false
    AZURE_STORAGE_CONTAINER: hmt-core-container
    ORG_EMAIL_DOMAIN: gmail.com
    GOOGLE_REDIRECT_URI: https://hmt.parkroadfellowship.org/oauth/google/callback

  secret:
    - REDIS_HOST
    - REDIS_PASSWORD
    - REDIS_PORT
    - DB_HOST
    - DB_USERNAME
    - DB_PASSWORD
    - WEATHER_API_URL
    - WEATHER_API_KEY
    - GEMINI_API_KEY
    - GOOGLE_MAPS_API_KEY
    - APP_KEY
    - AZURE_STORAGE_CONNECTION_STRING
    - AZURE_SPEECH_SUBSCRIPTION_KEY
    - MAIL_HOST
    - MAIL_PORT
    - MAIL_USERNAME
    - MAIL_PASSWORD
    - MAIL_ENCRYPTION
    - MAIL_FROM_ADDRESS
    - GOOGLE_APPLICATION_CREDENTIALS
    - GOOGLE_SHEETS_SOCIAL_MEDIA_SHEET_NAME
    - GOOGLE_SHEETS_SOCIAL_MEDIA_SPREADSHEET_ID
    - GOOGLE_DRIVE_SHARED_DRIVE_ID
    - GOOGLE_DRIVE_MISSIONS_FOLDER_ID
    - PRF_NLP_BASE_URL
    - PRF_NLP_API_KEY
    - CORS_ALLOWED_ORIGINS

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
#
# aliases:
#   shell: app exec --interactive --reuse "bash"

# Use a different ssh user than root
#
ssh:
  user: azureuser
  # log_level: debug
  # keys: ["~/.ssh/id_prfops"]

# Use a persistent storage volume.
#
volumes:
  - "/opt/hmt/logs/production:/var/www/html/storage/logs"
