# Name of your application. Used to uniquely configure containers.
service: prf-core

# Name of the container image.
image: prf/prf-core

# Deploy to these servers.
servers:
  web:
    hosts:
      - 4.221.155.241
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Enable SSL auto certification via Let's Encrypt (and allow for multiple apps on one server).
# Set ssl: false if using something like Cloudflare to terminate SSL (but keep host!).
proxy:
  ssl: true
  hosts:
    - api.parkroadfellowship.org # For the API
    - app.parkroadfellowship.org # For the APP
    - ws.parkroadfellowship.org # For the Websockets
  # kamal-proxy connects to your container over port 80, use `app_port` to specify a different port.
  app_port: 8050
  response_timeout: 120
  healthcheck:
    path: /robots.txt
    interval: 1
    timeout: 600

# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  server: prfcore.azurecr.io
  username: frog-github

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64
  args:
    NEW_RELIC_AGENT_VERSION: 11.6.0.19
    IMAGE_NAME: PRF Missions
    NEW_RELIC_APPNAME: PRF Core
    NEW_RELIC_LICENSE_KEY: 547ecd8fba7795abfc826d8aea18e16eFFFFNRAL
    NEW_RELIC_APP_NAME: PRF Core

deploy_timeout: 600
drain_timeout: 600
# Inject ENV variables into containers (secrets come from .kamal/secrets).
#
env:
  clear:
    APP_NAME: Parkroad Fellowship
    APP_ENV: production
    APP_DEBUG: false
    APP_TIMEZONE: UTC
    APP_URL: https://app.parkroadfellowship.org
    APP_LOCALE: en
    APP_FALLBACK_LOCALE: en
    APP_FAKER_LOCALE: en_US
    APP_MAINTENANCE_DRIVER: cache
    APP_MAINTENANCE_STORE: redis
    BCRYPT_ROUNDS: 12
    LOG_CHANNEL: newrelic
    LOG_LEVEL: debug
    LOG_STACK: daily
    LOG_DEPRECATIONS_CHANNEL: "null"
    SESSION_DRIVER: redis
    SESSION_LIFETIME: 120
    SESSION_ENCRYPT: false
    SESSION_PATH: /
    SESSION_DOMAIN: "null"
    MAIL_MAILER: smtp
    MAIL_FROM_NAME: PRF Missions
    VITE_APP_NAME: PRF Missions
    BROADCAST_CONNECTION: reverb
    FILESYSTEM_DISK: azure
    QUEUE_CONNECTION: database
    TELESCOPE_QUEUE_CONNECTION: database
    CACHE_STORE: redis
    CACHE_PREFIX: ""
    MEMCACHED_HOST: 127.0.0.1
    REDIS_CLIENT: phpredis
    DB_CONNECTION: pgsql
    DB_PORT: 5432
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 9060
    REVERB_PORT: 443
    REVERB_SCHEME: https
    VITE_REVERB_PORT: 443
    VITE_REVERB_SCHEME: https
    WEATHER_API_UNITS: metric
    FILAMENT_GOOGLE_MAPS_FORCE_HTTPS: true
    PAYSTACK_API_URL: https://api.paystack.co
    PULSE_DB_CONNECTION: pulse
    FILAMENT_FILESYSTEM_DISK: azure

  secret:
    - REDIS_HOST
    - REDIS_PASSWORD
    - REDIS_PORT
    - DB_HOST
    - DB_DATABASE
    - DB_USERNAME
    - DB_PASSWORD
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_REDIRECT_URI
    - REVERB_APP_ID
    - REVERB_APP_KEY
    - REVERB_APP_SECRET
    - REVERB_HOST
    - VITE_REVERB_APP_KEY
    - VITE_REVERB_HOST
    - WEATHER_API_URL
    - WEATHER_API_KEY
    - GEMINI_API_KEY
    - GOOGLE_MAPS_API_KEY
    - APP_KEY
    - AZURE_STORAGE_CONNECTION_STRING
    - AZURE_STORAGE_CONTAINER
    - AZURE_SPEECH_SUBSCRIPTION_KEY
    - MAIL_HOST
    - MAIL_PORT
    - MAIL_USERNAME
    - MAIL_PASSWORD
    - MAIL_ENCRYPTION
    - MAIL_FROM_ADDRESS
    - PAYSTACK_PUBLIC_KEY
    - PAYSTACK_SECRET_KEY
    - AFRICAS_TALKING_USERNAME
    - AFRICAS_TALKING_API_KEY
    - NEW_RELIC_APP_ID
    - NEW_RELIC_API_KEY
    - NEW_RELIC_LICENSE_KEY
    - NEW_RELIC_APP_NAME
    - ADVANTA_BASE_URL
    - ADVANTA_PARTNER_ID
    - ADVANTA_API_KEY
    - ADVANTA_SHORT_CODE

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
#
# aliases:
#   shell: app exec --interactive --reuse "bash"

# Use a different ssh user than root
#
ssh:
  user: azureuser
  # log_level: debug
  # keys: ["~/.ssh/id_prfops"]

# Use a persistent storage volume.
#
# volumes:
#   - "/custom/mount/app_storage/database/:/var/www/html/database/"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
#
# asset_path: /app/public/assets

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2

# Use accessory services (secrets come from .kamal/secrets).
#
accessories:
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    host: 4.221.155.241
    port: 6379
    cmd: "dragonfly --requirepass=${DRAGONFLY_PASSWORD} --bind 0.0.0.0"
    env:
      secret:
        - DRAGONFLY_PASSWORD
    directories:
      - data:/data

  postgres:
    image: postgres:16
    host: 4.221.155.241
    port: 5432
    env:
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
        - POSTGRES_DB
    files:
      - manifests/kamal/init/init-pgsql.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/postgresql/data

  metabase:
    image: metabase/metabase:v0.55.x
    host: 4.221.155.241
    port: 3000
    proxy:
      ssl: true
      app_port: 3000
      healthcheck:
        path: /api/health
      hosts:
        - analytics.parkroadfellowship.org
    env:
      clear:
        MB_DB_TYPE: postgres
        MB_DB_PORT: 5432
      secret:
        - MB_DB_HOST
        - MB_DB_USER
        - MB_DB_DBNAME
        - MB_DB_PASS
  
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    host: 4.221.155.241
    port: 5000
    proxy:
      ssl: true
      app_port: 5000
      healthcheck:
        path: /api
      hosts:
        - socials.parkroadfellowship.org
    env: 
      clear:
        MAIN_URL: https://socials.parkroadfellowship.org
        FRONTEND_URL: https://socials.parkroadfellowship.org
        NEXT_PUBLIC_BACKEND_URL: https://socials.parkroadfellowship.org/api
        JWT_SECRET: "random"
        BACKEND_INTERNAL_URL: http://localhost:3000
        IS_GENERAL: true
        DISABLE_REGISTRATION: true
        STORAGE_PROVIDER: "cloudflare"
        UPLOAD_DIRECTORY: "/uploads"
        NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
        EMAIL_PROVIDER: "nodemailer"
        EMAIL_SECURE: "true"
        NX_ADD_PLUGINS: false
        POSTIZ_GENERIC_OAUTH: false
        POSTIZ_OAUTH_URL: https://accounts.google.com
        POSTIZ_OAUTH_AUTH_URL: https://accounts.google.com/o/oauth2/v2/auth
        POSTIZ_OAUTH_TOKEN_URL: https://oauth2.googleapis.com/token
        POSTIZ_OAUTH_USERINFO_URL: https://www.googleapis.com/oauth2/v3/userinfo
        POSTIZ_OAUTH_SCOPE: "openid profile email"
        KUTT_API_ENDPOINT: https://short.parkroadfellowship.org/api/v2
      secret:
        - DATABASE_URL
        - REDIS_URL
        - EMAIL_HOST
        - EMAIL_PORT
        - EMAIL_USER
        - EMAIL_PASS
        - CLOUDFLARE_ACCOUNT_ID
        - CLOUDFLARE_ACCESS_KEY
        - CLOUDFLARE_SECRET_ACCESS_KEY
        - CLOUDFLARE_BUCKETNAME
        - CLOUDFLARE_REGION
        - CLOUDFLARE_BUCKET_URL
        - POSTIZ_OAUTH_CLIENT_ID
        - POSTIZ_OAUTH_CLIENT_SECRET
        - KUTT_API_KEY
    directories:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
  
  kutt:
    image: kutt/kutt
    host: 4.221.155.241
    port: 7000
    proxy:
      ssl: true
      app_port: 7000
      healthcheck:
        path: /
      hosts:
        - short.parkroadfellowship.org
        - link.parkroadfellowship.org
    env:
      clear:
        PORT: 7000
        DEFAULT_DOMAIN: link.parkroadfellowship.org
        SITE_NAME: "PRF Shortener"
        DB_CLIENT: pg
        REDIS_ENABLED: true
        DB_NAME: kutt
        DB_PORT: 5432
        MAIL_ENABLED: true
        MAIL_FROM: automated.contributions@parkroadfellowship.org
        JWT_SECRET: sdfasdfarewdsafadsfasd
      secret:
        - DB_HOST
        - DB_PASSWORD
        - DB_USER
        - REDIS_HOST
        - REDIS_PORT 
        - REDIS_PASSWORD
        - MAIL_HOST
        - MAIL_PORT
        - MAIL_USER
        - MAIL_PASSWORD

