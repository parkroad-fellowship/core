name: AnythingLLM Deployment

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy_anything_llm:
    name: Build and deploy AnythingLLM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_BUILDKIT: 1
      DEBUG: on
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3.0

      - name: Cache Kamal gems
        uses: actions/cache@v5
        with:
          path: ~/.gem
          key: ${{ runner.os }}-gems-kamal-anythingllm-${{ hashFiles('manifests/anything_llm/config/deploy.yml') }}
          restore-keys: |
            ${{ runner.os }}-gems-kamal-anythingllm-

      - name: Install Kamal
        run: |
          gem install specific_install
          gem specific_install https://github.com/basecamp/kamal.git

      - name: Validate Kamal configuration
        working-directory: manifests/anything_llm
        run: kamal config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:master

      - name: Prepare Kamal secrets
        working-directory: manifests/anything_llm
        run: |
          mkdir -p .kamal
          touch .kamal/secrets
          chmod 600 .kamal/secrets
          echo "KAMAL_REGISTRY_PASSWORD=${KAMAL_REGISTRY_PASSWORD}" > .kamal/secrets

      - name: Deploy accessories and app
        working-directory: manifests/anything_llm
        run: |
          set -e
          kamal lock release
          kamal accessory boot qdrant
          kamal accessory boot ollama
          kamal deploy -v
